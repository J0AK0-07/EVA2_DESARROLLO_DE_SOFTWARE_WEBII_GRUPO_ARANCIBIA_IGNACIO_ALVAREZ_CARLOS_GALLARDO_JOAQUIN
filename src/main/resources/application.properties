# Configuración local reproducible. H2 conserva los datos en ./data incluso después de cerrar Java.
spring.application.name=sabor-gourmet
server.port=${PORT:8080}
server.address=127.0.0.1
spring.datasource.url=jdbc:h2:file:./data/sabor-gourmet;DB_CLOSE_ON_EXIT=FALSE;LOCK_TIMEOUT=10000
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Santiago
spring.jpa.properties.hibernate.format_sql=true
spring.thymeleaf.cache=false
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.indent-output=true
spring.jackson.time-zone=America/Santiago
app.demo-data=true
server.error.include-message=never
server.error.include-stacktrace=never
spring.mvc.format.date=yyyy-MM-dd
spring.mvc.format.time=HH:mm
logging.level.cl.ipss.saborgourmet=INFO

# Solo cookies para evitar identificadores de sesión en direcciones de redirección.
server.servlet.session.tracking-modes=cookie
