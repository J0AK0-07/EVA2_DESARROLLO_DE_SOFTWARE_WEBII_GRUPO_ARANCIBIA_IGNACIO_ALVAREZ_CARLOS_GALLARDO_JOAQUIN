# Perfil opcional. Crear previamente la base saborgourmet y definir estas variables de entorno.
# Ejecutar: java -jar dist/sabor-gourmet.jar --spring.profiles.active=mysql
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/saborgourmet?serverTimezone=America/Santiago}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
